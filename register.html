<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Học Sinh - Tin Học Nhóm 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Firebase SDK (v10 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-900 relative overflow-hidden py-12 px-4 sm:px-6 lg:px-8">

<div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

<div class="max-w-md w-full space-y-8 relative z-10">
    <div>
        <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white transition">
            <i class="fas fa-arrow-left"></i> Quay lại Trang Chủ
        </a>
    </div>

    <div class="bg-white/95 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl border border-slate-200/50">
        <div class="text-center mb-8">
            <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 items-center justify-center text-white text-2xl shadow-lg shadow-emerald-500/30 mb-4">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 font-heading">
                Tạo Tài Khoản
            </h2>
            <p class="text-sm text-slate-500 mt-2">
                Đăng ký tài khoản học sinh để tham gia luyện tập và lưu điểm số
            </p>
        </div>

        <div id="reg-error-alert" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-200 flex items-start gap-3 animate-fade-in">
            <i class="fas fa-exclamation-circle text-red-500 text-lg mt-0.5"></i>
            <div class="text-sm font-medium text-red-700" id="reg-error-msg"></div>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Họ và tên học sinh</label>
                <input type="text" id="reg_fullname" required placeholder="Ví dụ: Nguyễn Văn An"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-600 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Tên tài khoản (Username)</label>
                <input type="text" id="reg_username" required placeholder="Ví dụ: annguyen"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-600 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email</label>
                <input type="email" id="reg_email" required placeholder="an@student.vn"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-600 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Mật khẩu</label>
                <div class="relative">
                    <input type="password" id="reg_password" required placeholder="Tối thiểu 6 ký tự"
                           class="w-full px-4 py-2.5 pr-10 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-600 text-sm">
                    <button type="button" class="toggle-password absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600" data-target="reg_password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Xác nhận mật khẩu</label>
                <input type="password" id="reg_password_confirm" required placeholder="Nhập lại mật khẩu"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-600 text-sm">
            </div>

            <button type="submit" id="regSubmitBtn" class="w-full mt-2 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2">
                <i class="fas fa-user-check"></i> <span>Hoàn Tất Đăng Ký</span>
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-6">
            Đã có tài khoản? 
            <a href="login.html" class="text-indigo-600 font-bold hover:underline">Đăng nhập tại đây</a>
        </p>
    </div>
</div>

<script src="assets/js/main.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullname = document.getElementById('reg_fullname').value.trim();
    const username = document.getElementById('reg_username').value.trim();
    const email = document.getElementById('reg_email').value.trim();
    const password = document.getElementById('reg_password').value;
    const confirmPass = document.getElementById('reg_password_confirm').value;

    const errorAlert = document.getElementById('reg-error-alert');
    const errorMsg = document.getElementById('reg-error-msg');
    const submitBtn = document.getElementById('regSubmitBtn');

    errorAlert.classList.add('hidden');

    if (password.length < 6) {
        errorMsg.textContent = 'Mật khẩu phải có ít nhất 6 ký tự.';
        errorAlert.classList.remove('hidden');
        return;
    }

    if (password !== confirmPass) {
        errorMsg.textContent = 'Mật khẩu xác nhận không khớp.';
        errorAlert.classList.remove('hidden');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Đang tạo tài khoản...';

    try {
        await registerStudentAccount(email, username, fullname, password);
        alert('Chúc mừng bạn đã đăng ký tài khoản thành công! Nhấn OK để vào trang chính.');
        window.location.href = 'index.html';
    } catch (err) {
        console.error('Lỗi đăng ký:', err);
        let msg = err.message;
        if (err.code === 'auth/email-already-in-use') {
            msg = 'Địa chỉ email này đã được đăng ký. Vui lòng đăng nhập hoặc dùng email khác.';
        } else if (err.code === 'auth/weak-password') {
            msg = 'Mật khẩu quá yếu. Vui lòng đặt mật khẩu phức tạp hơn.';
        }

        errorMsg.textContent = msg;
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-user-check"></i> <span>Hoàn Tất Đăng Ký</span>';
    }
});
</script>
</body>
</html>
